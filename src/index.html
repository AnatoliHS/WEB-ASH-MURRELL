---
layout: default
---

<section class="starter">
  <div class="container">
    <img class="starter-logo" src="/images/logo.png" alt="" width="72" height="72">
    <span class="eyebrow eyebrow-accent">{{ site.name }}</span>
    <h1><span class="text-accent">Thrive</span> over Survive.</h1>
    <p class="starter-tagline">{{ site.tagline }}</p>
    <div class="starter-actions">
      <a class="btn btn-primary" href="mailto:{{ site.email }}">Start a conversation</a>
      <a class="btn btn-secondary" href="{{ site.social.spotify }}">Listen to Amplified</a>
    </div>
  </div>
</section>
